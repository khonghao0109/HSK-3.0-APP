rule_files:
  - media-alerts.yml

evaluation_interval: 1m

tests:
  - name: no traffic does not consume an availability error budget
    interval: 1m
    external_url: https://runbooks.test.invalid
    alert_rule_test:
      - eval_time: 20m
        alertname: HskMediaIngestionFastBurn
        exp_alerts: []
      - eval_time: 20m
        alertname: HskMediaIngestionSlowBurn
        exp_alerts: []
      - eval_time: 20m
        alertname: HskMediaSignedContentFastBurn
        exp_alerts: []
      - eval_time: 20m
        alertname: HskMediaSignedContentSlowBurn
        exp_alerts: []

  - name: invalid signed grants remain security telemetry without poisoning availability
    interval: 1m
    external_url: https://runbooks.test.invalid
    input_series:
      - series: hsk_media_signed_content_started_total{instance="public-edge"}
        values: 0+100x30
      - series: hsk_media_signed_content_requests_total{instance="public-edge",outcome="invalid_grant"}
        values: 0+100x30
    alert_rule_test:
      - eval_time: 20m
        alertname: HskMediaSignedContentFastBurn
        exp_alerts: []
      - eval_time: 20m
        alertname: HskMediaSignedContentSlowBurn
        exp_alerts: []

  - name: rejected and disabled ingestion attempts remain telemetry without poisoning valid availability
    interval: 1m
    external_url: https://runbooks.test.invalid
    input_series:
      - series: hsk_media_ingestion_started_total{instance="public-edge"}
        values: 0+100x30
      - series: hsk_media_ingestion_requests_total{instance="public-edge",outcome="rejected"}
        values: 0+70x30
      - series: hsk_media_ingestion_requests_total{instance="public-edge",outcome="disabled"}
        values: 0+30x30
    alert_rule_test:
      - eval_time: 20m
        alertname: HskMediaIngestionFastBurn
        exp_alerts: []
      - eval_time: 20m
        alertname: HskMediaIngestionSlowBurn
        exp_alerts: []

  - name: eligible ingestion failures and cleanup-required outcomes burn valid availability
    interval: 1m
    external_url: https://runbooks.test.invalid
    input_series:
      - series: hsk_media_ingestion_started_total{instance="backend-0"}
        values: 0+100x30
      - series: hsk_media_ingestion_requests_total{instance="backend-0",outcome="success"}
        values: 0+80x30
      - series: hsk_media_ingestion_requests_total{instance="backend-0",outcome="failed"}
        values: 0+10x30
      - series: hsk_media_ingestion_requests_total{instance="backend-0",outcome="cleanup_required"}
        values: 0+10x30
    alert_rule_test:
      - eval_time: 20m
        alertname: HskMediaIngestionFastBurn
        exp_alerts:
          - exp_labels:
              severity: page
              owner: media-platform
              slo: ingestion-availability
            exp_annotations:
              summary: Media ingestion is consuming its error budget rapidly
              runbook_url: __MEDIA_RUNBOOK_URL__
      - eval_time: 20m
        alertname: HskMediaIngestionSlowBurn
        exp_alerts:
          - exp_labels:
              severity: ticket
              owner: media-platform
              slo: ingestion-availability
            exp_annotations:
              summary: Media ingestion is consuming its error budget persistently
              runbook_url: __MEDIA_RUNBOOK_URL__

  - name: eligible signed provider integrity and availability failures burn the SLO
    interval: 1m
    external_url: https://runbooks.test.invalid
    input_series:
      - series: hsk_media_signed_content_started_total{instance="backend-0"}
        values: 0+100x30
      - series: hsk_media_signed_content_requests_total{instance="backend-0",outcome="success"}
        values: 0+90x30
      - series: hsk_media_signed_content_requests_total{instance="backend-0",outcome="unavailable"}
        values: 0+4x30
      - series: hsk_media_signed_content_requests_total{instance="backend-0",outcome="provider_mismatch"}
        values: 0+3x30
      - series: hsk_media_signed_content_requests_total{instance="backend-0",outcome="integrity_error"}
        values: 0+3x30
    alert_rule_test:
      - eval_time: 20m
        alertname: HskMediaSignedContentFastBurn
        exp_alerts:
          - exp_labels:
              severity: page
              owner: media-platform
              slo: signed-content-availability
            exp_annotations:
              summary: Signed media delivery is consuming its error budget rapidly
              runbook_url: __MEDIA_RUNBOOK_URL__
      - eval_time: 20m
        alertname: HskMediaSignedContentSlowBurn
        exp_alerts:
          - exp_labels:
              severity: ticket
              owner: media-platform
              slo: signed-content-availability
            exp_annotations:
              summary: Signed media delivery is consuming its error budget persistently
              runbook_url: __MEDIA_RUNBOOK_URL__

  - name: global database gauges aggregate three replicas to one alert and resolve
    interval: 1m
    external_url: https://runbooks.test.invalid
    input_series:
      - series: hsk_media_cleanup_required{instance="10.0.0.1:9464",pod="backend-0"}
        values: 1x4 0x4
      - series: hsk_media_cleanup_required{instance="10.0.0.2:9464",pod="backend-1"}
        values: 1x4 0x4
      - series: hsk_media_cleanup_required{instance="10.0.0.3:9464",pod="backend-2"}
        values: 1x4 0x4
      - series: hsk_media_cleanup_oldest_age_seconds{instance="10.0.0.1:9464",pod="backend-0"}
        values: 601x4 0x4
      - series: hsk_media_cleanup_oldest_age_seconds{instance="10.0.0.2:9464",pod="backend-1"}
        values: 601x4 0x4
      - series: hsk_media_cleanup_oldest_age_seconds{instance="10.0.0.3:9464",pod="backend-2"}
        values: 601x4 0x4
      - series: hsk_media_stuck_processing{instance="10.0.0.1:9464",pod="backend-0"}
        values: 1x4 0x4
      - series: hsk_media_stuck_processing{instance="10.0.0.2:9464",pod="backend-1"}
        values: 1x4 0x4
      - series: hsk_media_stuck_processing{instance="10.0.0.3:9464",pod="backend-2"}
        values: 1x4 0x4
      - series: hsk_media_metrics_database_available{instance="10.0.0.1:9464",pod="backend-0"}
        values: 1x8
      - series: hsk_media_metrics_database_available{instance="10.0.0.2:9464",pod="backend-1"}
        values: 1x8
      - series: hsk_media_metrics_database_available{instance="10.0.0.3:9464",pod="backend-2"}
        values: 1x8
    alert_rule_test:
      - eval_time: 2m
        alertname: HskMediaCleanupBacklog
        exp_alerts:
          - exp_labels:
              severity: page
              owner: media-platform
            exp_annotations:
              summary: Media object cleanup exceeded its five-minute SLO
              runbook_url: __MEDIA_RUNBOOK_URL__
      - eval_time: 2m
        alertname: HskMediaProcessingStuck
        exp_alerts:
          - exp_labels:
              severity: page
              owner: media-platform
            exp_annotations:
              summary: Media ingestion is stuck beyond the processing fence
              runbook_url: __MEDIA_RUNBOOK_URL__
      - eval_time: 6m
        alertname: HskMediaCleanupBacklog
        exp_alerts: []
      - eval_time: 6m
        alertname: HskMediaProcessingStuck
        exp_alerts: []

  - name: replica health aggregates failures into one logical alert
    interval: 1m
    external_url: https://runbooks.test.invalid
    input_series:
      - series: up{job="hsk-media-replicas",instance="10.0.0.1:9464",pod="backend-0"}
        values: 1x10
      - series: up{job="hsk-media-replicas",instance="10.0.0.2:9464",pod="backend-1"}
        values: 0x7 1x3
      - series: up{job="hsk-media-replicas",instance="10.0.0.3:9464",pod="backend-2"}
        values: 1x10
    alert_rule_test:
      - eval_time: 6m
        alertname: HskMediaReplicaScrapeFailure
        exp_alerts:
          - exp_labels:
              severity: page
              owner: platform-sre
            exp_annotations:
              summary: Prometheus cannot scrape one or more backend media replicas
              runbook_url: __MEDIA_RUNBOOK_URL__
      - eval_time: 9m
        alertname: HskMediaReplicaScrapeFailure
        exp_alerts: []

  - name: discovery loss and database collector health fail closed
    interval: 1m
    external_url: https://runbooks.test.invalid
    input_series:
      - series: hsk_media_metrics_database_available{instance="10.0.0.1:9464",pod="backend-0"}
        values: 0x8
      - series: hsk_media_metrics_database_snapshot_stale{instance="10.0.0.1:9464",pod="backend-0"}
        values: 1x8
    alert_rule_test:
      - eval_time: 5m
        alertname: HskMediaReplicaTargetUnderMinimum
        exp_alerts:
          - exp_labels:
              severity: page
              owner: platform-sre
            exp_annotations:
              summary: Prometheus discovered fewer than two backend media replicas
              runbook_url: __MEDIA_RUNBOOK_URL__
      - eval_time: 5m
        alertname: HskMediaMetricsDatabaseUnavailable
        exp_alerts:
          - exp_labels:
              severity: page
              owner: platform-sre
            exp_annotations:
              summary: Media metrics collector cannot obtain a database snapshot
              runbook_url: __MEDIA_RUNBOOK_URL__
      - eval_time: 5m
        alertname: HskMediaMetricsSnapshotStale
        exp_alerts:
          - exp_labels:
              severity: page
              owner: platform-sre
            exp_annotations:
              summary: Media metrics collector snapshot is stale
              runbook_url: __MEDIA_RUNBOOK_URL__

  - name: multi-window burn rates and processing p95 aggregate replicas
    interval: 1m
    external_url: https://runbooks.test.invalid
    input_series:
      - series: hsk_media_ingestion_started_total{instance="10.0.0.1:9464",pod="backend-0"}
        values: 0+100x30
      - series: hsk_media_ingestion_started_total{instance="10.0.0.2:9464",pod="backend-1"}
        values: 0+100x30
      - series: hsk_media_ingestion_requests_total{instance="10.0.0.1:9464",pod="backend-0",outcome="success"}
        values: 0+90x30
      - series: hsk_media_ingestion_requests_total{instance="10.0.0.2:9464",pod="backend-1",outcome="success"}
        values: 0+90x30
      - series: hsk_media_ingestion_requests_total{instance="10.0.0.1:9464",pod="backend-0",outcome="failed"}
        values: 0+10x30
      - series: hsk_media_ingestion_requests_total{instance="10.0.0.2:9464",pod="backend-1",outcome="failed"}
        values: 0+10x30
      - series: hsk_media_signed_content_started_total{instance="10.0.0.1:9464",pod="backend-0"}
        values: 0+100x30
      - series: hsk_media_signed_content_started_total{instance="10.0.0.2:9464",pod="backend-1"}
        values: 0+100x30
      - series: hsk_media_signed_content_requests_total{instance="10.0.0.1:9464",pod="backend-0",outcome="success"}
        values: 0+90x30
      - series: hsk_media_signed_content_requests_total{instance="10.0.0.2:9464",pod="backend-1",outcome="success"}
        values: 0+90x30
      - series: hsk_media_signed_content_requests_total{instance="10.0.0.1:9464",pod="backend-0",outcome="unavailable"}
        values: 0+10x30
      - series: hsk_media_signed_content_requests_total{instance="10.0.0.2:9464",pod="backend-1",outcome="unavailable"}
        values: 0+10x30
      - series: hsk_media_processing_duration_seconds_bucket{instance="10.0.0.1:9464",pod="backend-0",outcome="success",le="5"}
        values: 0+0x30
      - series: hsk_media_processing_duration_seconds_bucket{instance="10.0.0.1:9464",pod="backend-0",outcome="success",le="10"}
        values: 0+1x30
      - series: hsk_media_processing_duration_seconds_bucket{instance="10.0.0.1:9464",pod="backend-0",outcome="success",le="30"}
        values: 0+10x30
      - series: hsk_media_processing_duration_seconds_bucket{instance="10.0.0.1:9464",pod="backend-0",outcome="success",le="+Inf"}
        values: 0+10x30
      - series: hsk_media_processing_duration_seconds_bucket{instance="10.0.0.2:9464",pod="backend-1",outcome="success",le="5"}
        values: 0+0x30
      - series: hsk_media_processing_duration_seconds_bucket{instance="10.0.0.2:9464",pod="backend-1",outcome="success",le="10"}
        values: 0+1x30
      - series: hsk_media_processing_duration_seconds_bucket{instance="10.0.0.2:9464",pod="backend-1",outcome="success",le="30"}
        values: 0+10x30
      - series: hsk_media_processing_duration_seconds_bucket{instance="10.0.0.2:9464",pod="backend-1",outcome="success",le="+Inf"}
        values: 0+10x30
    alert_rule_test:
      - eval_time: 20m
        alertname: HskMediaIngestionFastBurn
        exp_alerts:
          - exp_labels:
              severity: page
              owner: media-platform
              slo: ingestion-availability
            exp_annotations:
              summary: Media ingestion is consuming its error budget rapidly
              runbook_url: __MEDIA_RUNBOOK_URL__
      - eval_time: 20m
        alertname: HskMediaIngestionSlowBurn
        exp_alerts:
          - exp_labels:
              severity: ticket
              owner: media-platform
              slo: ingestion-availability
            exp_annotations:
              summary: Media ingestion is consuming its error budget persistently
              runbook_url: __MEDIA_RUNBOOK_URL__
      - eval_time: 20m
        alertname: HskMediaSignedContentFastBurn
        exp_alerts:
          - exp_labels:
              severity: page
              owner: media-platform
              slo: signed-content-availability
            exp_annotations:
              summary: Signed media delivery is consuming its error budget rapidly
              runbook_url: __MEDIA_RUNBOOK_URL__
      - eval_time: 20m
        alertname: HskMediaSignedContentSlowBurn
        exp_alerts:
          - exp_labels:
              severity: ticket
              owner: media-platform
              slo: signed-content-availability
            exp_annotations:
              summary: Signed media delivery is consuming its error budget persistently
              runbook_url: __MEDIA_RUNBOOK_URL__
      - eval_time: 20m
        alertname: HskMediaProcessingLatency
        exp_alerts:
          - exp_labels:
              severity: ticket
              owner: media-platform
              slo: processing-p95
            exp_annotations:
              summary: Media processing p95 exceeds eight seconds
              runbook_url: __MEDIA_RUNBOOK_URL__

  - name: signed-content slow burn aggregates replicas and resolves after the long window
    interval: 10m
    external_url: https://runbooks.test.invalid
    input_series:
      - series: hsk_media_signed_content_started_total{instance="10.0.0.1:9464",pod="backend-0"}
        values: 0+100x80
      - series: hsk_media_signed_content_started_total{instance="10.0.0.2:9464",pod="backend-1"}
        values: 0+100x80
      - series: hsk_media_signed_content_requests_total{instance="10.0.0.1:9464",pod="backend-0",outcome="success"}
        values: 0+90x35 3150+100x45
      - series: hsk_media_signed_content_requests_total{instance="10.0.0.2:9464",pod="backend-1",outcome="success"}
        values: 0+90x35 3150+100x45
      - series: hsk_media_signed_content_requests_total{instance="10.0.0.1:9464",pod="backend-0",outcome="unavailable"}
        values: 0+10x35 350x45
      - series: hsk_media_signed_content_requests_total{instance="10.0.0.2:9464",pod="backend-1",outcome="unavailable"}
        values: 0+10x35 350x45
    alert_rule_test:
      - eval_time: 4h
        alertname: HskMediaSignedContentSlowBurn
        exp_alerts:
          - exp_labels:
              severity: ticket
              owner: media-platform
              slo: signed-content-availability
            exp_annotations:
              summary: Signed media delivery is consuming its error budget persistently
              runbook_url: __MEDIA_RUNBOOK_URL__
      - eval_time: 12h
        alertname: HskMediaSignedContentSlowBurn
        exp_alerts: []

  - name: started without terminal outcomes alerts separately from availability
    interval: 1m
    external_url: https://runbooks.test.invalid
    input_series:
      - series: hsk_media_ingestion_started_total{instance="backend-0"}
        values: 0+10x20
      - series: hsk_media_ingestion_requests_total{instance="backend-0",outcome="success"}
        values: 0+8x20
      - series: hsk_media_ingestion_inflight{instance="backend-0"}
        values: 2x20
      - series: hsk_media_signed_content_started_total{instance="backend-0"}
        values: 0+10x20
      - series: hsk_media_signed_content_requests_total{instance="backend-0",outcome="success"}
        values: 0+8x20
      - series: hsk_media_signed_content_inflight{instance="backend-0"}
        values: 2x20
    alert_rule_test:
      - eval_time: 16m
        alertname: HskMediaIngestionTerminalDeficit
        exp_alerts:
          - exp_labels: { severity: page, owner: media-platform }
            exp_annotations:
              summary: Started media ingestion requests are not reaching terminal outcomes
              runbook_url: __MEDIA_RUNBOOK_URL__
      - eval_time: 16m
        alertname: HskMediaSignedContentTerminalDeficit
        exp_alerts:
          - exp_labels: { severity: page, owner: media-platform }
            exp_annotations:
              summary: Started signed-content requests are not reaching terminal outcomes
              runbook_url: __MEDIA_RUNBOOK_URL__

  - name: process start gauge detects repeated restart and resolves
    interval: 1m
    external_url: https://runbooks.test.invalid
    input_series:
      - series: hsk_media_process_start_time_seconds{instance="backend-0"}
        values: 100 100 200 200 300 300 400x5 400x20
    alert_rule_test:
      - eval_time: 7m
        alertname: HskMediaProcessRestartLoop
        exp_alerts:
          - exp_labels: { severity: page, owner: platform-sre }
            exp_annotations:
              summary: Media backend processes are restarting repeatedly
              runbook_url: __MEDIA_RUNBOOK_URL__
      - eval_time: 25m
        alertname: HskMediaProcessRestartLoop
        exp_alerts: []

  - name: pod replacement counts missing terminal outcomes as failures and resolves
    interval: 1m
    external_url: https://runbooks.test.invalid
    input_series:
      - series: hsk_media_ingestion_started_total{instance="backend-old",pod="backend-old"}
        values: 0 1 stale
      - series: hsk_media_signed_content_started_total{instance="backend-old",pod="backend-old"}
        values: 0 1 stale
      - series: hsk_media_process_start_time_seconds{instance="backend-old",pod="backend-old"}
        values: 100 100 stale
      - series: hsk_media_process_start_time_seconds{instance="backend-new",pod="backend-new"}
        values: stale stale 200x45
      - series: hsk_media_ingestion_inflight{instance="backend-new",pod="backend-new"}
        values: stale stale 0x45
      - series: hsk_media_signed_content_inflight{instance="backend-new",pod="backend-new"}
        values: stale stale 0x45
    alert_rule_test:
      - eval_time: 4m
        alertname: HskMediaIngestionFastBurn
        exp_alerts:
          - exp_labels:
              severity: page
              owner: media-platform
              slo: ingestion-availability
            exp_annotations:
              summary: Media ingestion is consuming its error budget rapidly
              runbook_url: __MEDIA_RUNBOOK_URL__
      - eval_time: 4m
        alertname: HskMediaSignedContentFastBurn
        exp_alerts:
          - exp_labels:
              severity: page
              owner: media-platform
              slo: signed-content-availability
            exp_annotations:
              summary: Signed media delivery is consuming its error budget rapidly
              runbook_url: __MEDIA_RUNBOOK_URL__
      - eval_time: 4m
        alertname: HskMediaIngestionTerminalDeficit
        exp_alerts:
          - exp_labels: { severity: page, owner: media-platform }
            exp_annotations:
              summary: Started media ingestion requests are not reaching terminal outcomes
              runbook_url: __MEDIA_RUNBOOK_URL__
      - eval_time: 4m
        alertname: HskMediaSignedContentTerminalDeficit
        exp_alerts:
          - exp_labels: { severity: page, owner: media-platform }
            exp_annotations:
              summary: Started signed-content requests are not reaching terminal outcomes
              runbook_url: __MEDIA_RUNBOOK_URL__
      - eval_time: 7m
        alertname: HskMediaProcessRestartLoop
        exp_alerts:
          - exp_labels: { severity: page, owner: platform-sre }
            exp_annotations:
              summary: Media backend processes are restarting repeatedly
              runbook_url: __MEDIA_RUNBOOK_URL__
      - eval_time: 40m
        alertname: HskMediaIngestionFastBurn
        exp_alerts: []
      - eval_time: 40m
        alertname: HskMediaSignedContentFastBurn
        exp_alerts: []
      - eval_time: 40m
        alertname: HskMediaIngestionTerminalDeficit
        exp_alerts: []
      - eval_time: 40m
        alertname: HskMediaSignedContentTerminalDeficit
        exp_alerts: []
      - eval_time: 40m
        alertname: HskMediaProcessRestartLoop
        exp_alerts: []
