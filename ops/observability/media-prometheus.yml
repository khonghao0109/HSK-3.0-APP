global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/media-alerts.yml

scrape_configs:
  - job_name: hsk-media-replicas
    metrics_path: /api/v1/internal/metrics/media
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /run/secrets/hsk_media_metrics_token
    static_configs:
      - targets:
          - backend-media-0.hsk-backend-media-metrics.hsk.svc.cluster.local:3000
          - backend-media-1.hsk-backend-media-metrics.hsk.svc.cluster.local:3000
        labels:
          service: hsk-backend
          environment: staging
