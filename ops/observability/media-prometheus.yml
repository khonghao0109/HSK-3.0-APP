global:
  scrape_interval: 30s
  scrape_timeout: 5s
  evaluation_interval: 30s

rule_files:
  - media-alerts.yml

alerting:
  alertmanagers:
    - scheme: http
      path_prefix: /
      static_configs:
        - targets: [hsk-media-alertmanager.monitoring.svc.cluster.local:9093]

scrape_configs:
  - job_name: hsk-media-replicas
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /run/secrets/hsk_media_metrics_token
    dns_sd_configs:
      - names: [hsk-backend-media-metrics.hsk.svc.cluster.local]
        type: A
        port: 9464
        refresh_interval: 30s
    relabel_configs:
      - target_label: service
        replacement: hsk-backend
    metric_relabel_configs:
      - action: labeldrop
        regex: endpoint|container
