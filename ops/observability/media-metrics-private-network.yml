apiVersion: v1
kind: ServiceAccount
metadata:
  name: hsk-media-prometheus
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hsk-media-operator
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hsk-media-grafana
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: hsk-backend-media-metrics
  namespace: hsk
  labels:
    app.kubernetes.io/name: hsk-backend
    hsk.io/traffic: private-metrics
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app.kubernetes.io/name: hsk-backend
  ports:
    - name: media-metrics
      port: 9464
      targetPort: media-metrics
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hsk-backend-media-metrics-private
  namespace: hsk
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hsk-backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hsk-edge
          podSelector:
            matchLabels:
              app.kubernetes.io/name: hsk-nginx
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9464
---
# Istio peer authentication is the executable encryption contract for both the
# media metrics scrape and Prometheus-to-Alertmanager traffic. Deployments without
# Istio must supply an equivalent mTLS policy and update the validation harness.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: hsk-backend-media-metrics-strict-mtls
  namespace: hsk
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hsk-backend
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: hsk-backend-media-metrics-principal
  namespace: hsk
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hsk-backend
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/monitoring/sa/hsk-media-prometheus
      to:
        - operation:
            ports: ["9464"]
            methods: [GET]
            paths: [/metrics]
    - from:
        - source:
            namespaces: [hsk-edge]
      to:
        - operation:
            ports: ["3000"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hsk-media-alertmanager
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: hsk-media-prometheus
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: web
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hsk-media-prometheus-private
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hsk-media-grafana
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hsk-media-operator
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hsk
          podSelector:
            matchLabels:
              app.kubernetes.io/name: hsk-backend
      ports:
        - protocol: TCP
          port: 9464
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hsk-media-alertmanager
      ports:
        - protocol: TCP
          port: 9093
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
          podSelector:
            matchLabels:
              app: istiod
      ports:
        - protocol: TCP
          port: 15012
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: hsk-media-prometheus-strict-mtls
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: hsk-media-prometheus-principal
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/monitoring/sa/hsk-media-grafana
              - cluster.local/ns/monitoring/sa/hsk-media-operator
      to:
        - operation:
            ports: ["9090"]
            methods: [GET, POST]
            paths: [/-/healthy, /-/ready, /api/v1/query, /api/v1/query_range]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hsk-media-prometheus
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
      annotations:
        sidecar.istio.io/inject: "true"
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
    spec:
      serviceAccountName: hsk-media-prometheus
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus@sha256:1147c92841726a6fef55fe6124491d6f85480f8de204f7d420304ca5bbd0a8f7
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=32d
          ports:
            - name: web
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: media-metrics-token
              mountPath: /run/secrets
              readOnly: true
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: web
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: hsk-media-prometheus
        - name: media-metrics-token
          projected:
            defaultMode: 256
            sources:
              - secret:
                  name: hsk-media-metrics-token
                  items:
                    - key: current
                      path: hsk_media_metrics_token
                  optional: false
        - name: data
          persistentVolumeClaim:
            claimName: hsk-media-prometheus-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hsk-media-prometheus-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hsk-media-alertmanager
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/name: hsk-media-alertmanager
  ports:
    - name: web
      port: 9093
      targetPort: web
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hsk-media-alertmanager-private
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hsk-media-alertmanager
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9093
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hsk-media-alertmanager
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hsk-media-alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hsk-media-alertmanager
      annotations:
        sidecar.istio.io/inject: "true"
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
    spec:
      serviceAccountName: hsk-media-alertmanager
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          image: quay.io/prometheus/alertmanager@sha256:a89f8d4520954079275441eecdb71444328bd90633dd4eddfc33b9ed657f349b
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: web
              containerPort: 9093
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: web
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: notification-secret
              mountPath: /run/secrets/hsk-alertmanager
              readOnly: true
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: hsk-media-alertmanager
        - name: notification-secret
          projected:
            defaultMode: 256
            sources:
              - secret:
                  name: hsk-media-alertmanager-webhook
                  optional: false
        - name: data
          persistentVolumeClaim:
            claimName: hsk-media-alertmanager-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hsk-media-alertmanager-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: hsk-media-alertmanager-strict-mtls
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hsk-media-alertmanager
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: hsk-media-alertmanager-principal
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hsk-media-alertmanager
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/monitoring/sa/hsk-media-prometheus
      to:
        - operation:
            ports: ["9093"]
---
apiVersion: v1
kind: Service
metadata:
  name: hsk-media-grafana
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/name: hsk-media-grafana
  ports:
    - name: web
      port: 3000
      targetPort: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hsk-media-grafana
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hsk-media-grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hsk-media-grafana
      annotations:
        sidecar.istio.io/inject: "true"
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
    spec:
      serviceAccountName: hsk-media-grafana
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: docker.io/grafana/grafana@sha256:e27e68cfd5795c1bea54950766078a02e84dfa3bafe0a4d0e5382f713dfd8e4e
          ports:
            - name: web
              containerPort: 3000
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: hsk-media-grafana-admin
                  key: username
                  optional: false
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hsk-media-grafana-admin
                  key: password
                  optional: false
          readinessProbe:
            httpGet:
              path: /api/health
              port: web
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard
              mountPath: /var/lib/grafana/dashboards/media-dashboard.json
              subPath: media-dashboard.json
              readOnly: true
            - name: dashboard
              mountPath: /etc/grafana/provisioning/dashboards/provider.yml
              subPath: provider.yml
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: provisioning
          configMap:
            name: hsk-media-grafana-datasource
        - name: dashboard
          configMap:
            name: hsk-media-grafana-dashboard
        - name: data
          persistentVolumeClaim:
            claimName: hsk-media-grafana-data
        - name: tmp
          emptyDir: {}
      # Secret hsk-media-grafana-admin is injected by the environment secret
      # manager; plaintext credentials never belong in this overlay.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hsk-media-grafana-private
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hsk-media-grafana
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hsk-media-operator
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
          podSelector:
            matchLabels:
              app: istiod
      ports:
        - protocol: TCP
          port: 15012
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: hsk-media-grafana-strict-mtls
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hsk-media-grafana
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: hsk-media-grafana-principal
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hsk-media-grafana
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/monitoring/sa/hsk-media-operator
      to:
        - operation:
            ports: ["3000"]
            methods: [GET, POST, DELETE]
            paths: [/api/health, /api/dashboards/*, /api/ds/*]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hsk-media-grafana-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
