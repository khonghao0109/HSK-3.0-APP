# Include only inside the public HTTPS server block. The surrounding `http`
# context must include `media-security-http.conf` once.

# Metrics never traverse public ingress. Prometheus scrapes each backend replica
# directly on the private monitoring network.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Reserve the private listener's actual path as well as all of its normalized
# namespace variants. This explicit edge denial prevents a later generic
# upstream route from accidentally publishing the private listener contract.
location ~* "^/metrics(?:/|;|$)" {
    access_log /var/log/nginx/media_access.log hsk_media_redacted;
    return 404;
}

# Reserve and deny the complete metrics namespace. Regex matching is performed
# on nginx's normalized URI, so case variants, duplicate/encoded separators,
# path parameters, trailing slashes, subpaths and query variants cannot fall
# through to the public generic upstream.
location ~* "^/api(?:;[^/]*)?/+v1(?:;[^/]*)?/+internal(?:;[^/]*)?/+metrics(?:/|;|$)" {
    access_log /var/log/nginx/media_access.log hsk_media_redacted;
    return 404;
}

# Catch the complete normalized signed-content route family before any generic
# proxy location. Only the exact raw canonical GET target is proxied; every
# ambiguous path/method variant remains query-redacted and is rejected here.
location ~* "^/api(?:;[^/]*)?/+v1(?:;[^/]*)?/+media(?:;[^/]*)?/+[^/;]+(?:;[^/]*)?/+content(?:/|;|$)" {
    access_log /var/log/nginx/media_access.log hsk_media_redacted;
    # Request-level diagnostics use the query-redacted access log. Only emerg
    # process/config failures enter this separate forensic stream; request-target
    # diagnostics are deliberately excluded to avoid signed-capability leakage.
    error_log /var/log/nginx/media_error.log emerg;
    if ($hsk_media_signed_request_canonical = 0) {
        return 404;
    }
    proxy_pass http://hsk_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    # A location-level proxy_set_header discards inherited ones, so the client
    # address is set here. The backend trusts one hop (TRUST_PROXY_HOPS=1) and
    # reads the entry nginx appends; the generic frontend location must set the
    # same three headers so the BFF can forward the chain verbatim.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors off;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header X-Request-ID $request_id always;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
