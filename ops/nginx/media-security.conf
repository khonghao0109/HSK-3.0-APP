# Include inside the HTTPS server block. `$uri` excludes the signed query string.
log_format hsk_media_redacted '$remote_addr - $request_method $uri $server_protocol '
                                '$status $body_bytes_sent $request_time $request_id';

location ~ ^/api/v1/media/[0-9]+/content$ {
    access_log /var/log/nginx/media_access.log hsk_media_redacted;
    # Native nginx error logging can include the complete request line. Disable it
    # for this capability route; retain request-id/status/latency in the safe log.
    error_log /dev/null crit;
    proxy_pass http://hsk_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "private, no-store" always;
}
