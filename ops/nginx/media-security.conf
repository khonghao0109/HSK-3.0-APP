# Include only inside the public HTTPS server block. The surrounding `http`
# context must include `media-security-http.conf` once.

# Metrics never traverse public ingress. Prometheus scrapes each backend replica
# directly on the private monitoring network.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

location = /api/v1/internal/metrics/media {
    access_log /var/log/nginx/media_access.log hsk_media_redacted;
    return 404;
}

location ~ ^/api/v1/media/[0-9]+/content$ {
    access_log /var/log/nginx/media_access.log hsk_media_redacted;
    # Native nginx error lines may include the complete request target. Critical
    # diagnostics remain in the safe access log via request/upstream status and ID.
    error_log /dev/null crit;
    proxy_pass http://hsk_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_intercept_errors off;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header X-Request-ID $request_id always;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
