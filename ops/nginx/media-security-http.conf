# Include once in the nginx `http` context. `$uri` excludes signed query data.
log_format hsk_media_redacted '$remote_addr - $request_method $uri $server_protocol '
                                '$status $upstream_status $body_bytes_sent '
                                '$request_time $upstream_response_time $request_id';

# `$request_uri` is inspected only to reject non-canonical signed-content routes;
# it is never emitted to a log. The backend independently verifies the same GET
# method and canonical resource as part of the HMAC payload.
map "$request_method:$request_uri" $hsk_media_signed_request_canonical {
    default 0;
    ~^GET:/api/v1/media/[1-9][0-9]*/content(?:\?[^\r\n#]*)?$ 1;
}

# The deployment owns the `hsk_backend` upstream and must point it at the
# private backend service. The validation harness supplies a loopback stub.
