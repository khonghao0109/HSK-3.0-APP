name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Validate Prisma schema
        env:
          # `prisma validate` chỉ đọc schema nhưng vẫn đòi env("DATABASE_URL")
          # resolve được. Giá trị này không được kết nối tới bao giờ.
          DATABASE_URL: postgresql://validate@127.0.0.1:5432/schema_validate
        run: npx prisma validate

      # `--ignore-scripts` bỏ qua postinstall của @prisma/client, nên Prisma Client
      # phải được sinh trước khi tsc và jest chạy.
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint:check

      - name: Format
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      # backend/openapi.json là contract commit trong repo (ADR-008 §5). Bước này
      # sinh lại từ code (nest build + Swagger plugin, không cần database) và fail
      # khi file commit bị lệch.
      - name: OpenAPI spec up to date
        run: npm run openapi:check

  backend-e2e:
    name: backend-e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hsk
          POSTGRES_PASSWORD: test-local-postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hsk -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      # Tên database kết thúc bằng `test` để qua guard
      # backend/src/common/utils/assert-disposable-test-database.ts.
      DATABASE_URL: postgresql://hsk:test-local-postgres@127.0.0.1:5432/hsk_ci_e2e_test
      TEST_DATABASE_URL: postgresql://hsk:test-local-postgres@127.0.0.1:5432/hsk_ci_e2e_test
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      # `pretest:e2e` tạo database, `prisma generate` rồi `prisma migrate deploy`.
      # Vì DATABASE_URL/TEST_DATABASE_URL được set tường minh ở đây, script không
      # bao giờ dựng lại (drop) database — đường đó chỉ dành cho default nội bộ.
      - name: E2E tests
        run: npm run test:e2e

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Generated types
        run: npm run test:generated-types
